# 每次推送到 main 或提交 PR 时构建一遍，给分支一个基本保障。
# tag 发布由 release.yml 负责，这里不再重复构建（否则同一个 commit 会跑两遍）。

name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支只保留最新一次运行，省得排队
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: test
        run: ./gradlew test
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
