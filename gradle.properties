# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17.20

# Mod Properties
# 版本号只有这一个来源：build.gradle 会把它显式赋给 project.version。
# 发布时 release.yml 会校验它与 tag 完全一致（例如 tag v1.2.3 ↔ mod_version=1.2.3）。
mod_version=1.0.5
group=ztqjntm.update

# Dependencies
fabric_api_version=0.141.6+1.21.11
# JEI 是可选兼容目标，编译期使用，不会写进 mod 的依赖声明
jei_version=27.54.0.116
